name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches plugin.json
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.json version $version"
            exit 1
          fi

      - name: Build prompt-fixer.skill
        run: cd skills && zip -r ../prompt-fixer.skill prompt-fixer

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" prompt-fixer.skill \
            --title "$GITHUB_REF_NAME" \
            --notes "Download prompt-fixer.skill to upload the skill to Claude.ai. Claude Code users get this version from the Claude directory or with /plugin marketplace update prompt-fixer."
